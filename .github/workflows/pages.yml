name: Refresh and deploy

on:
  push:
    branches: [main]
  schedule:
    # twice a day; the decide job thins this out as the launch gets older
    - cron: "17 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LAUNCH_DATE: "2026-10-16"

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.when.outputs.run }}
    steps:
      - id: when
        # Scheduled runs: both daily runs for the first 14 days, the 13:17 run until day 30, then Mondays only.
        # Pushes and manual runs always go.
        run: |
          days=$(( ( $(date -u +%s) - $(date -u -d "$LAUNCH_DATE" +%s) ) / 86400 ))
          hour=$(date -u +%H); dow=$(date -u +%u); run=false
          if [ "${{ github.event_name }}" != "schedule" ]; then run=true
          elif [ "$days" -lt 14 ]; then run=true
          elif [ "$days" -lt 30 ] && [ "$hour" = "13" ]; then run=true
          elif [ "$dow" = "1" ] && [ "$hour" = "13" ]; then run=true
          fi
          echo "day $days since launch, refresh=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.key.outputs.refresh }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check for API key
        id: key
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
        run: |
          if [ -n "$OPENSEA_API_KEY" ]; then echo "refresh=true" >> "$GITHUB_OUTPUT"; else echo "::warning::No OPENSEA_API_KEY secret, so nothing to build. Add the secret to refresh and deploy."; fi
      - uses: actions/setup-python@v5
        if: steps.key.outputs.refresh == 'true'
        with:
          python-version: "3.12"
      - name: Install tools
        if: steps.key.outputs.refresh == 'true'
        run: |
          pip install -q "pillow>=11.2"
      - uses: actions/cache@v4
        if: steps.key.outputs.refresh == 'true'
        with:
          path: |
            data/raw
            data/tiles
            data/midi
          key: avatars-${{ github.run_id }}
          restore-keys: avatars-
      - uses: actions/cache@v4
        if: steps.key.outputs.refresh == 'true'
        with:
          path: |
            data/crawl.json
            data/crawled_at
          # keyed on the crawler, so a change to what it fetches never reuses an older crawl
          key: crawl-${{ hashFiles('scripts/crawl.py') }}-${{ github.run_id }}
          restore-keys: crawl-${{ hashFiles('scripts/crawl.py') }}-
      - name: Crawl and build
        if: steps.key.outputs.refresh == 'true'
        env:
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          # pushes reuse a crawl under 6 hours old; scheduled and manual runs always crawl fresh
          CRAWL_MAX_AGE: ${{ github.event_name == 'push' && '21600' || '' }}
          SITE_URL: https://ryanio.github.io/card-census/
          GA_ID: ${{ vars.GA_ID }}
        run: ./scripts/refresh.sh
      - name: Commit refreshed data
        if: steps.key.outputs.refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/history
          if git diff --cached --quiet; then echo "data unchanged"; exit 0; fi
          # one data commit per UTC day, made by its first run; weekly once the runs go weekly at day 30
          last=$(git show HEAD:data/history/totals.csv 2>/dev/null | tail -n 1 | cut -d, -f1)
          if [ -n "$last" ] && [ "$last" != "at" ]; then
            if [ $(( $(date -u -d "$last" +%s) / 86400 )) -eq $(( $(date -u +%s) / 86400 )) ]; then echo "already committed data today (last $last)"; exit 0; fi
          fi
          git commit -q -m "Data $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
      - uses: actions/upload-pages-artifact@v3
        if: steps.key.outputs.refresh == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
